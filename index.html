<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f4c81" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Purchase Stock Estimate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <img src="logo.svg" alt="Blue Sky Est. for Beverages" />
      </div>
      <h1>Purchase Stock Estimate</h1>
      <p>Authorized access only</p>
      <form id="loginForm" autocomplete="off">
        <label class="field login-field">
          <span>Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" minlength="10" required />
        </label>
        <button id="loginBtn" class="primary login-btn" type="submit">Sign In</button>
      </form>
      <div id="loginMessage" class="login-message"></div>
    </div>
  </section>

  <main id="appShell" class="wrap hidden">
    <section class="card">
      <div class="brand-banner">
        <img src="logo.svg" alt="Blue Sky Est. for Beverages" />
      </div>

      <div class="topbar">
        <div>
          <h1>Purchase Stock Estimate</h1>
          <p>Enter Product Code and Quantity only.</p>
        </div>
        <div class="header-actions">
          <button id="refreshBtn" class="secondary">Refresh Products</button>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
      </div>

      <div class="meta-row">
        <label class="field">
          <span>Estimate Date</span>
          <input id="estimateDate" type="date" />
        </label>
      </div>

      <div class="status" id="status">Ready.</div>

      <div class="table-wrap">
        <table id="estimateTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Code</th>
              <th>Product Name</th>
              <th>UOM</th>
              <th>QTY</th>
              <th>Cost</th>
              <th>Total Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="actions">
        <button id="addRowBtn" class="secondary">+ Add Row</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div class="summary">
        <span>Grand Total</span>
        <strong id="grandTotal">SAR 0.00</strong>
      </div>

      <div class="actions right">
        <button id="printBtn" class="secondary">Print</button>
        <button id="saveBtn" class="primary">Save Estimate</button>
      </div>

      <div id="savedBox" class="saved hidden"></div>
    </section>
  </main>

  <datalist id="productCodes"></datalist>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
